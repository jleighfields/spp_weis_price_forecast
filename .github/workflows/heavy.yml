name: heavy

# The two groups the required check cannot afford: the src/modeling.py tests,
# which need torch installed, and the browser tests. The CUDA wheels are
# 3.5 GB (see test.yml) and Playwright adds a browser download on top, so
# both stay off the pull-request path.
#
# NOT a required status check — a scheduled workflow cannot report on a pull
# request, so requiring it would block every merge. A break here surfaces on
# the next push to main and is fixed with a new pull request.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"   # Mondays, 08:00 UTC
  workflow_dispatch:

concurrency:
  group: heavy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Tests that need torch
        run: uv run pytest -m torch -q

      - name: Install Playwright
        run: uv run playwright install --with-deps chromium

      # tests/e2e/app_for_test.py patches the heavy startup loaders with
      # synthetic data, so this needs no R2/S3 credentials and no model
      # checkpoints.
      - name: Browser tests
        run: uv run pytest -m e2e -q --tracing=retain-on-failure --screenshot=only-on-failure

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            test-results/
          if-no-files-found: ignore
          retention-days: 7
